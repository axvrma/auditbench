[build]
  command = "node scripts/build-landing.mjs"
  publish = "landing-dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- landing scripts/build-landing.mjs netlify.toml"
[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--ignore-scripts"
  NPM_CONFIG_IGNORE_SCRIPTS = "true"
[context.deploy-preview]
  command = "node scripts/build-landing.mjs"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src https://api.github.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'none'"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
