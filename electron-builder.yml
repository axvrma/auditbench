appId: com.axvrma.lighthouse-agent
productName: Auditbench
icon: desktop/icon.png
artifactName: Auditbench-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - desktop/main.mjs
  - desktop/icon.png
  - server/dist/**/*.js
  - dashboard/dist/**/*
asarUnpack:
  - "**/*.node"
mac:
  icon: desktop/icon.icns
  category: public.app-category.developer-tools
  target: dmg
  identity: "-"
win:
  icon: desktop/icon.ico
  target: [nsis, zip]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: desktop/icon.ico
  uninstallerIcon: desktop/icon.ico
linux:
  icon: desktop/icon.png
  target: AppImage
  category: Development
